name: Release Module

# Se déclenche à chaque push d'un tag de version, ex : v1.0.0, v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que la version du tag correspond à module.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -pe "require('./module.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas à la version dans module.json ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Créer l'archive module.zip
        run: |
          zip -r module.zip module.json scripts templates styles lang README.md LICENSE

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: |
            module.zip
            module.json
          fail_on_unmatched_files: true
          generate_release_notes: true
